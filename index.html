<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0d1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="A clean, mobile-friendly snake game with fruit, XP levels and coins." />
  <title>Serpent — Snake</title>

  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230d1220'/%3E%3Cpath d='M25 62c0-12 12-12 12-22s-12-10-12-22' fill='none' stroke='%2340d98a' stroke-width='11' stroke-linecap='round'/%3E%3Ccircle cx='70' cy='34' r='9' fill='%237cf0b4'/%3E%3Ccircle cx='73' cy='32' r='3' fill='%230d1220'/%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <header id="hud">
      <div class="progress">
        <div class="lv-badge">Lv&nbsp;<span id="level">1</span></div>
        <div class="xp-track" aria-label="Experience">
          <div class="xp-fill" id="xpFill"></div>
        </div>
      </div>

      <div class="hud-right">
        <div class="totems" id="totems" title="Totems of Undying"></div>
        <div class="coins" title="Coins">
          <span class="coin-ic" aria-hidden="true"></span>
          <span id="coins">0</span>
        </div>
        <button id="muteBtn" class="icon-btn" type="button" aria-label="Toggle sound" title="Sound">
          <svg viewBox="0 0 24 24" class="ic ic-sound"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        </button>
        <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause" title="Pause">
          <svg viewBox="0 0 24 24" class="ic"><rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/></svg>
        </button>
      </div>
    </header>

    <div id="stage">
      <canvas id="game"></canvas>
      <div id="overlay" class="overlay"><!-- rendered per-state --></div>
    </div>

    <footer id="hint" class="hint">
      <span class="hint-desktop">Arrow keys / WASD to move &nbsp;·&nbsp; Space to pause</span>
      <span class="hint-mobile">Swipe to steer</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
